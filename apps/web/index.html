<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-logo.png" />
    <link rel="apple-touch-icon" href="/favicon-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08070a" />
    <title>IL BRAVO | Peluquería & Barbería — Reservá tu turno</title>
    <meta
      name="description"
      content="Reservá tu turno online en IL BRAVO, peluquería y barbería en Zona Centro, Córdoba."
    />
    <meta property="og:title" content="IL BRAVO | Peluquería & Barbería" />
    <meta
      property="og:description"
      content="Reservá tu turno online en segundos. Zona Centro, Córdoba."
    />
    <meta property="og:type" content="website" />

    <!--
      Fuentes: antes se cargaban con @import dentro del CSS, lo que obliga
      al navegador a esperar a descargar y parsear el CSS entero antes de
      darse cuenta de que necesita ir a buscar las fuentes — un viaje de
      ida y vuelta extra, en serie. Con preconnect + link acá arriba, el
      navegador arranca la conexión y la descarga en paralelo con todo lo
      demás, apenas lee el HTML.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!-- Arranca antes la conexión con Supabase, así la primera consulta
         (servicios, horarios) no pierde tiempo en el handshake TLS. -->
    <link rel="preconnect" href="https://sckhnrbvbzeajrwkckza.supabase.co" crossorigin />
  </head>
  <body>
    <div id="root">
      <!--
        Se ve mientras se descarga y arranca el JS (React lo reemplaza
        apenas monta). Sin esto la pantalla queda totalmente negra y sin
        ningún indicio de que algo está pasando, que es justo lo que
        confunde en conexiones de celular lentas.
      -->
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #08070a;
          color: rgba(248, 247, 244, 0.45);
          font-family: system-ui, sans-serif;
          font-size: 0.85rem;
          letter-spacing: 0.04em;
        "
      >
        Cargando…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
